<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        /* Магия стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        /* Конверт/Карточка */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 10;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .card h1 {
            font-size: 3rem;
            color: #b83b5e;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 1.5rem;
            color: #6b3b4a;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card .sub-text {
            font-size: 1rem;
            color: #8a5a6a;
            font-weight: normal;
            opacity: 0.9;
        }

        .heart-emoji {
            font-size: 4rem;
            display: block;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Падающие сердечки (CSS-only) */
        .falling-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы кликалось сквозь них на карточку */
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: #ff4d6d;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* Интерактив: меняем цвет при клике */
        .card:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Создаем 20 падающих сердец через JS (чтобы не писать вручную) -->
    <div class="falling-hearts" id="heartContainer"></div>

    <!-- Главная открытка -->
    <div class="card" onclick="changeText()">
        <span class="heart-emoji">❤️</span>
        <h1>С днём рождения!</h1>
        <p>Мой хороший ❤️</p>
        <div class="sub-text">(кликни на меня, чтобы я сказала кое-что ещё)</div>
    </div>

    <script>
        // 1. Генерация дождя из сердец
        const container = document.getElementById('heartContainer');
        const heartSymbols = ['❤️', '💖', '💕', '💗', '💘', '🩷'];

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Случайные параметры
            const size = Math.random() * 1.5 + 1; // от 1rem до 2.5rem
            heart.style.fontSize = size + 'rem';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 10 + 8) + 's'; // 8-18 секунд
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.style.opacity = Math.random() * 0.6 + 0.3;
            
            container.appendChild(heart);
        }

        // 2. Интерактив: при клике на карточку меняется текст
        function changeText() {
            const card = document.querySelector('.card');
            const title = card.querySelector('h1');
            const p = card.querySelector('p');
            const sub = card.querySelector('.sub-text');

            // Меняем содержимое
            if (title.textContent === 'С днём рождения!') {
                title.textContent = 'Ты самый лучший! ✨';
                p.textContent = 'Спасибо, что ты есть у меня 💋';
                sub.textContent = '❤️ Люблю тебя бесконечно ❤️';
            } else {
                title.textContent = 'С днём рождения!';
                p.textContent = 'Мой хороший ❤️';
                sub.textContent = '(кликни на меня, чтобы я сказала кое-что ещё)';
            }
        }
    </script>

</body>
</html>
